name: Django CI & Koyeb CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Tests
        # Fallback mechanism is active: tests will run on temporary in-memory SQLite and local FileSystemStorage
        run: |
          python manage.py test

  deploy:
    name: Deploy to Koyeb
    needs: test
    runs-on: ubuntu-latest
    # Only deploy on direct push to the main branch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Koyeb
        uses: koyeb/action-git-deploy@v1
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}
          app_name: "blogging-system"       # TODO: Isko apne Koyeb App Name se replace karein
          service_name: "blogging-system"   # TODO: Isko apne Koyeb Service Name se replace karein
