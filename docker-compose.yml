services:
  market-engine:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - MARKET_SYMBOL=${MARKET_SYMBOL:-BTCUSDT}
      - EXCHANGE_WS_URL=${EXCHANGE_WS_URL:-wss://socket.delta.exchange}
      - EXCHANGE_REST_URL=${EXCHANGE_REST_URL:-https://api.delta.exchange}
      - HEATMAP_PRICE_BIN_WIDTH=${HEATMAP_PRICE_BIN_WIDTH:-50}
      - PORT=8080
    restart: unless-stopped

  research-api:
    build:
      context: ./research-python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MARKET_SYMBOL=${MARKET_SYMBOL:-BTCUSDT}
      - MARKET_ENGINE_URL=http://market-engine:8080
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./research.db}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-120b}
    depends_on:
      - market-engine
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - market-engine
      - research-api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
